<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Health Education</title>
  <link rel="stylesheet" href="LandoHarris/CommunityHealthEducation/components/theme.css">
</head>

<body>

  <!-- COMPONENT PLACEHOLDERS -->
  <div id="alert-placeholder"></div>
  <div id="nav-placeholder"></div>

  <main class="homepage-layout">
    <!-- your homepage content -->
  </main>

  <div id="sidebar-placeholder"></div>
  <div id="footer-placeholder"></div>

  <!-- COMPONENT LOADER -->
  <script>
    function loadComponent(id, file) {
      fetch(file)
        .then(res => res.text())
        .then(html => {
          document.getElementById(id).innerHTML = html;
        });
    }

    loadComponent("alert-placeholder", "LandoHarris/CommunityHealthEducation/components/alerts.html");
    loadComponent("nav-placeholder", "LandoHarris/CommunityHealthEducation/components/nav.html");
    loadComponent("sidebar-placeholder", "LandoHarris/CommunityHealthEducation/components/sidebar.html");
    loadComponent("footer-placeholder", "LandoHarris/CommunityHealthEducation/components/footer.html");
  </script>

  <!-- GLOBAL SCRIPT: attach hamburger menu AFTER nav loads -->
  <script>
    function waitForElement(selector, callback) {
      const el = document.querySelector(selector);
      if (el) return callback(el);

      const observer = new MutationObserver(() => {
        const el = document.querySelector(selector);
        if (el) {
          observer.disconnect();
          callback(el);
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });
    }

    waitForElement("#hamburger", () => {
      document.getElementById("hamburger").onclick = () => {
        document.getElementById("nav-links").classList.toggle("open");
      };
    });
  </script>

</body>
</html>
